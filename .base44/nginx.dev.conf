# Base44 development nginx config for the "web" service.
#
# The project's own services/web/nginx.conf serves a Parcel bundle built into the
# image at /usr/share/nginx/html. Here we instead serve services/web straight from
# the bind-mounted source, so index.html's "../src/index.js" resolves at
# /src/index.js with no bundler step, and edits show up on refresh.
#
# The /backend/ upstream is the same one the project's own config uses (compose
# service name "backend-for-frontend"), which keeps the app single-origin so the
# frontend's relative fetch('/backend/createPicture') works unchanged.
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        root /srv/web;

        location = / {
            try_files /static/index.html =404;
        }

        location /backend/ {
            proxy_pass http://backend-for-frontend:10114/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
